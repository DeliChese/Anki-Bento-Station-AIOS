[pytest]
# Smoke-test cho Bento Station AIOS (root).
# Đặt TRONG tests/ để rootdir = tests/ → chuỗi package của test module dừng ở
# tests/ (nhờ tests/__init__.py), KHÔNG leo lên import nhầm `__init__.py` của
# addon root (thư mục addon là package Anki, không thể import độc lập).
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
consider_namespace_packages = true
addopts = --import-mode=importlib -p no:cacheprovider
